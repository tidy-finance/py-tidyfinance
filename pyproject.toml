[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidyfinance"
authors = [{name = "Christoph Frey", email = "christoph.frey@gmail.com"},
	   {name = "Christoph Scheuch", email = "christoph@tidy-intelligence.com"},
       {name = "Stefan Voigt", email = "stefan.voigt@econ.ku.dk"}
           ]
version = "0.5.2"
description = "Tidy Finance Helper Functions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Core data frame library; the package computes in polars.
    "polars>=1.0.0",
    # Default backend of the public API; pandas<->polars conversion at
    # the package boundary goes through pyarrow.
    "pandas>=2.2.0",
    "pyarrow>=19.0.1",
    "numpy>=1.26.0",
    # HTTP downloads (impersonation needed by several data providers).
    "curl_cffi>=0.10.0",
    # WRDS access: SQLAlchemy engine + PostgreSQL driver + .env
    # credentials (mirrors RPostgres/DBI in r-tidyfinance's Imports).
    "sqlalchemy>=2.0.21",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    # Design matrices for the regression functions.
    "formulaic>=1.0.0",
]

[project.optional-dependencies]
# Kept for backward compatibility: polars is a core dependency since
# the 0.5.0 rewrite, so this extra is a no-op.
polars = ["polars>=1.0.0"]
# Only needed by get_available_famafrench_datasets, which scrapes the
# Kenneth French data library page and degrades with a clear
# ImportError when lxml is absent.
scraping = ["lxml>=5.3.1"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.0.0",
    "polars>=1.0.0"
]
docs = [
    "great-docs>=0.14.0",
]

[project.urls]
Repository = "https://github.com/tidy-finance/py-tidyfinance"
Issues = "https://github.com/tidy-finance/py-tidyfinance/issues"
Changelog = "https://github.com/tidy-finance/py-tidyfinance/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore::pytest.PytestAssertRewriteWarning",
]

[tool.ruff]
line-length = 80
